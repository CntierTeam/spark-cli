[package]
name = "spark-dump"
version = "1.2.0"
edition = "2021"
description = "Full-featured CLI for lucko spark profiles (viewer-parity dump/filter/views)"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/CntierTeam/spark-cli"

[[bin]]
name = "spark-dump"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
prost = "0.13"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
